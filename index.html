<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-hearts" id="bgHearts"></div>
    
    <div class="container" id="mainContainer">
        <h1 class="question" id="question">Will you be my Valentine?</h1>
        
        <div class="buttons-container" id="buttonsContainer">
            <button class="btn btn-yes" id="yesBtn">Yes! 💕</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <div class="celebration hidden" id="celebration">
        <div class="celebration-content">
            <h2 class="celebration-title" id="celebrationTitle">YAYYY I LOVE YOUUU! 💖</h2>
            <p class="celebration-message">I hope you will be my valentine for the rest of our lives cutiee! ALL eternity of life we have left. we will make it the most beautiful life ever as long as it is the both of us!! I love youuuuu!!!!</p>
        </div>
        <div class="floating-hearts" id="floatingHearts"></div>
        <img class="jumping-gif" id="jumpingGif" src="" alt="Celebration GIF">
    </div>

    <script src="script.js"></script>
</body>
</html>
